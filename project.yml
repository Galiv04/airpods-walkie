name: AirPodsWalkie
options:
  bundleIdPrefix: com.galiv04
  developmentLanguage: it
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    RELAY_URL: ""
    MARKETING_VERSION: "0.7.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
targets:
  AirPodsWalkie:
    type: application
    platform: iOS
    sources: [AirPodsWalkie]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.galiv04.airpodswalkie
        GENERATE_INFOPLIST_FILE: NO
    info:
      path: AirPodsWalkie/Info.plist
      properties:
        CFBundleDisplayName: Roger
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIBackgroundModes: [audio]
        NSMicrophoneUsageDescription: "Serve per trasmettere la tua voce all'altro iPhone."
        NSLocalNetworkUsageDescription: "Serve per collegarsi direttamente all'altro iPhone (walkie-talkie)."
        NSBonjourServices: ["_airwalkie._tcp", "_airwalkie._udp"]
        ITSAppUsesNonExemptEncryption: false
        RelayURL: "$(RELAY_URL)"
        CFBundleURLTypes:
          - CFBundleURLName: com.galiv04.airpodswalkie.pair
            CFBundleURLSchemes: [roger]
  AirPodsWalkieTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: AirPodsWalkie
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.galiv04.airpodswalkie.tests
schemes:
  AirPodsWalkie:
    build:
      targets:
        AirPodsWalkie: all
        AirPodsWalkieTests: [test]
    test:
      targets: [AirPodsWalkieTests]
