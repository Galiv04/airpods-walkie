name: Deploy relay

on:
  push:
    branches: [main]
    paths: ["relay/**"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Test relay (Node)
        working-directory: relay
        run: |
          npm install --silent
          (PORT=8799 node server.js & sleep 1; PORT=8799 node test.js)
      - name: Deploy to Cloudflare Workers
        if: env.CF_TOKEN != ''
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: relay
      - name: Skipped
        if: env.CF_TOKEN == ''
        run: |
          echo "CLOUDFLARE_API_TOKEN non impostato, deploy saltato (vedi docs/RELAY.md)."
