name: Build IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned)
        run: |
          xcodebuild -project AirPodsWalkie.xcodeproj -scheme AirPodsWalkie \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            RELAY_URL="${{ vars.RELAY_URL || 'https://airwalkie-relay.galiv04.workers.dev' }}" \
            build

      - name: Package IPA
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/AirPodsWalkie.app Payload/
          zip -qr AirPodsWalkie.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: AirPodsWalkie-ipa
          path: AirPodsWalkie.ipa

      - name: Publish rolling release "latest"
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest -y --cleanup-tag || true
          gh release create latest AirPodsWalkie.ipa --prerelease \
            --title "Latest build" --notes "Unsigned IPA. Install with SideStore/AltStore/Sideloadly. See docs/INSTALL.md."

  screenshots:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Screenshot nel simulatore
        run: tools/ci-screenshots.sh screenshots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: screenshots
          retention-days: 14

  test:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Unit test (simulatore)
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=[x for rt,ds in json.load(sys.stdin)["devices"].items() if "iOS" in rt for x in ds if x["name"].startswith("iPhone")]; print(d[0]["udid"])')
          xcodebuild test -project AirPodsWalkie.xcodeproj -scheme AirPodsWalkie \
            -destination "id=$UDID" -derivedDataPath build-test | tail -60
          exit ${PIPESTATUS[0]}
